# Teljes kódbázis review 7. kör (2026-08-30), Metrológia/Adatintegritás P2
# lelet: ez a fájl korábban a lenti "instruments"/"temperature_compensation_
# mode" mezőkön KÍVÜL sok szekciót (timing/dmm_voltage/safety/
# psu_limits_by_mode/series_diode/taper) tartalmazott, amiket a Python-kód
# SEHOL nem olvas ki (grep-pel megerősítve: config_panel.py::_load_yaml()
# kizárólag az itt maradt kulcsokat kéri le) — a ténylegesen HASZNÁLT
# safety/mérési/timing paraméterek a Python dataclass-alapértékekben élnek
# (pl. ChargeConfig, SafetyManager, TestRunnerConfig), NEM ebben a fájlban.
# A törölt szekciók egy része (pl. dmm_voltage.nplc_*) AKTÍVAN eltért is a
# ténylegesen futó értéktől (TestRunnerConfig.charge_discharge_nplc/
# relax_ocv_nplc) — félrevezető volt, nem csak hatástalan (CLAUDE.md §12/
# §13). Ha egy paramétert ténylegesen yaml-konfigurálhatóvá kell tenni,
# ahhoz a kód oldalán is be kell kötni (config_panel.py::_load_yaml() +
# a megfelelő dataclass konstruálása), nem elég csak ide felvenni.
instruments:
  psu:
    resource: "PLACEHOLDER"
    combination_mode: INDEPENDENT

  load:
    resource: "PLACEHOLDER"

  dmm_voltage:
    resource: "PLACEHOLDER"

  dmm_temperature:
    resource: "PLACEHOLDER"

temperature_compensation_mode: MONITOR_ONLY
